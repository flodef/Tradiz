name: Build Windows Installer

on:
    push:
        branches: [main]
    workflow_dispatch:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install

            - name: Build Windows installer
              if: github.event_name != 'release'
              run: bun electron:dist:win:ci

            - name: Build and publish Windows installer
              if: github.event_name == 'release'
              run: bun electron:publish:win
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload 64-bit installer
              if: github.event_name != 'release'
              uses: actions/upload-artifact@v4
              with:
                  name: tradiz-windows-installer-x64
                  path: dist/*-win.exe

            - name: Upload 32-bit installer
              if: github.event_name != 'release'
              uses: actions/upload-artifact@v4
              with:
                  name: tradiz-windows-installer-ia32
                  path: dist/*-win-ia32.exe
