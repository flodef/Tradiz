appId: fr.tradiz.app
productName: Tradiz
copyright: Copyright © 2024 Tradiz
publish:
    provider: github
    owner: flodef
    repo: Tradiz
    releaseType: release
directories:
    output: dist
files:
    - electron/**/*
    - package.json
    # Only include node_modules needed by the Electron main process.
    # The Next.js standalone server bundles its own dependencies separately.
    # Exclude all node_modules first, then re-include only what the Electron
    # main process requires. Order matters: negation must come before re-includes.
    - '!node_modules'
    - '!src'
    - '!__tests__'
    - '!scripts'
    - '!coverage'
    - '!dist'
    - '!out'
    - '!build'
    - '!*.log'
    - '!.env*.local'
    - node_modules/electron-updater/**/*
    - node_modules/builder-util-runtime/**/*
    - node_modules/lazy-val/**/*
    - node_modules/js-yaml/**/*
    - node_modules/argparse/**/*
    - node_modules/sax/**/*
    - node_modules/semver/**/*
    - node_modules/tiny-typed-emitter/**/*
    - node_modules/lodash.escaperegexp/**/*
    - node_modules/lodash.isequal/**/*
    - node_modules/fs-extra/**/*
    - node_modules/jsonfile/**/*
    - node_modules/universalify/**/*
    - node_modules/graceful-fs/**/*
    - node_modules/debug/**/*
    - node_modules/ms/**/*
    - node_modules/serialport/**/*
    - node_modules/@serialport/**/*
    - node_modules/node-gyp-build/**/*
    - node_modules/node-addon-api/**/*
extraResources:
    - from: electron/standalone-build
      to: standalone
    - from: electron/drivers
      to: drivers
      filter:
          - '**/*'
asar: false
npmRebuild: false
nodeGypRebuild: false
win:
    target:
        - target: nsis
          arch:
              - x64
              - ia32
    artifactName: ${productName}-${version}-win-${arch}.${ext}
    icon: public/icons/icons-512.png
nsis:
    oneClick: true
    perMachine: false
    uninstallDisplayName: Tradiz
    createDesktopShortcut: true
    createStartMenuShortcut: true
    shortcutName: Tradiz
    differentialPackage: true
    deleteAppDataOnUninstall: false
    runAfterFinish: true
mac:
    target:
        - dmg
    icon: public/icons/icons-512.png
linux:
    target:
        - AppImage
        - deb
    artifactName: ${productName}-${version}-linux-${arch}.${ext}
    icon: public/icons/icons-512.png
    category: Office
    maintainer: Tradiz <contact@tradiz.fr>
